server:
  port: 8081

spring:
  application:
    name: customer-service

  datasource:
    # customer_db must already exist in Postgres - unlike MySQL there's no
    # createDatabaseIfNotExist flag. Create it once via pgAdmin4 or:
    # CREATE DATABASE customer_db;
    url: jdbc:postgresql://localhost:5432/customer_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # POC only - use migrations (Flyway/Liquibase) for real projects
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    # This is a single-machine POC - every service lives on the same host,
    # so registering by hostname=localhost avoids Eureka picking up a wrong/
    # stale LAN IP when the machine has multiple network interfaces (Docker,
    # VPN, etc.) or its DHCP address changes mid-session.
    prefer-ip-address: false
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.poc.customer: DEBUG
