server:
  port: 8080

spring:
  application:
    name: api-gateway
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgres
  cloud:
    gateway:
      routes:
        # Everything the client calls goes through the composite service,
        # which itself talks to customer-service and order-service.
        - id: composite-service
          uri: lb://composite-service
          predicates:
            - Path=/api/composite/**

        # Optional: expose the atomic services directly too, useful while
        # you're testing each one in isolation.
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/customers/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    # Pull the registry every 5s instead of every 30s, so a newly started
    # dependency is discoverable almost immediately.
    registry-fetch-interval-seconds: 5
  instance:
    # Single-machine POC - register by hostname=localhost rather than an
    # auto-detected LAN IP, which is unreliable on a host with multiple
    # network interfaces (Docker, VPN, etc.).
    prefer-ip-address: false
    hostname: localhost
    # Eureka's defaults (30s renew, 90s expiry) are tuned for large clusters where
    # heartbeat traffic matters. On a single-machine POC they are just latency:
    # a freshly started service takes ~30s to become callable, and a killed one
    # lingers in the registry for ~90s - long enough to mask whether a circuit
    # breaker or a stale registry entry caused a failed call.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

# POC only - a real deployment pulls this from a secret manager/env var,
# used only for the gateway's own /auth/login-issued tokens.
jwt:
  secret: "poc-only-shared-secret-change-me-before-any-real-use-32bytes+"
  expiration-minutes: 60

# Real OIDC provider (Keycloak, running locally in Docker - see
# scripts/keycloak/realm-import.json for the realm/client/user it imports).
# The gateway verifies tokens against this JWKS; it never talks to Keycloak
# to issue tokens itself.
keycloak:
  jwk-set-uri: http://localhost:8180/realms/microservices-poc/protocol/openid-connect/certs

logging:
  level:
    org.springframework.cloud.gateway: INFO
