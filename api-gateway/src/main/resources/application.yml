server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # The composite service is the only thing exposed through the
            # gateway. customer-service and order-service are reachable only
            # via composite-service, not directly through this edge - so the
            # orchestration layer is never bypassed.
            - id: composite-service
              uri: lb://composite-service
              predicates:
                - Path=/api/composite/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    # Single-machine POC - register by hostname=localhost rather than an
    # auto-detected LAN IP, which is unreliable on a host with multiple
    # network interfaces (Docker, VPN, etc.).
    prefer-ip-address: false
    hostname: localhost

# Local-only auth. There is no identity provider and no database: the same
# symmetric secret both signs tokens (JwtEncoder) and verifies them
# (ReactiveJwtDecoder) - see SecurityConfig.
#
# POC only - a real deployment pulls the secret from a secret manager or an
# environment variable, and keeps users somewhere other than a config file.
# HS256 needs at least 256 bits, so this secret must stay >= 32 characters.
jwt:
  secret: "poc-only-shared-secret-change-me-before-any-real-use-32bytes+"
  expiration-ms: 3600000   # 1 hour
  # Credentials accepted by POST /auth/login, checked as plain text.
  users:
    raj: "S3cure!Pass"
    demo: "demo123"

logging:
  level:
    org.springframework.cloud.gateway: INFO
